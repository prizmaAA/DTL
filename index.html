<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ООО ДТЛ ЭКСПЕРТ | Дорожная лаборатория Курган</title>
    <style>
        :root {
            --primary: #0f172a;     
            --accent: #f59e0b;      
            --bg-site: #f1f5f9;     
            --card-bg: #ffffff;     
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-site);
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 5px solid var(--accent);
        }

        header h1 {
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
        }

        header p {
            margin: 10px 0 0;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: #cbd5e1;
        }

        .tabs-nav {
            background: #1e293b;
            display: flex;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .tab-link {
            background: none;
            border: none;
            color: #94a3b8;
            padding: 15px 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            max-width: 160px;
            text-align: center;
            border-bottom: 3px solid transparent;
        }

        .tab-link:hover {
            color: #ffffff;
            background: #273549;
        }

        .tab-link.active {
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
            background: #0f172a;
        }

        .main-container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
            width: 100%;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-card {
            background: var(--card-bg);
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
        }

        .info-card h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.4rem;
            border-left: 5px solid var(--accent);
            padding-left: 12px;
            margin-bottom: 20px;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 769px) {
            .about-grid {
                grid-template-columns: 1.1fr 0.9fr;
            }
        }

        .director-card {
            background: #f8fafc;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
        }

        @media (min-width: 480px) {
            .director-card {
                flex-direction: row;
                text-align: left;
                align-items: flex-start;
            }
        }

        .director-photo {
            width: 110px;
            height: 110px;
            border-radius: 50%; 
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .director-info h3 {
            margin: 0 0 8px 0;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .director-info p {
            margin: 0 0 8px 0;
            font-size: 0.95rem;
        }

        .services-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 769px) {
            .services-list {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .service-item {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .service-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .service-text {
            padding: 20px;
            flex-grow: 1;
        }

        .service-text h3 {
            margin: 0 0 10px;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .service-text p {
            margin: 0;
            font-size: 0.95rem;
            color: #334155;
            text-align: left;
        }
